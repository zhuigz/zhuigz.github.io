<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追光者 · 曹宗昱 | 光的长廊 · 集大成之书</title>
<meta name="description" content="追光者 · 曹宗昱的集大成长篇：一条从冷夜微光到万丈光的「光的长廊」，以底色、来路、此身、信念、远方、系统、造物、同行、成为十章串起一个人的人生叙事弧。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@200;300;400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== [00] TOKENS ===== */
/* :root 调色板（逐字移植 index，变量名一字不改 · architecture 硬约束 #3）
   + --scene-* 动态场景层（场景引擎按章切换的色温变量）。详见 T1.2 / KD-1。 */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 暖金主色系 */
  --gold: #E8B87A;
  --gold-light: #F4D9A8;
  --gold-deep: #C99A56;
  --gold-pale: rgba(232,184,122,0.06);
  --gold-glow: rgba(232,184,122,0.25);

  /* 余烬/赤色辅助（凤凰涅槃的火） */
  --ember: #C36B5E;
  --ember-soft: rgba(195,107,94,0.18);

  /* 紫蓝绿点缀（克制使用） */
  --accent-violet: #8E7AB8;
  --accent-teal: #7FA8AD;
  --accent-sage: #88A878;

  /* 底色与文字 */
  --bg-deep: #07070C;
  --bg-elev: #11111A;
  --bg-card: rgba(255,255,255,0.025);
  --bg-card-hi: rgba(255,255,255,0.055);
  --ink: #F2EFEB;
  --ink-soft: rgba(242,239,235,0.62);
  --ink-dim: rgba(242,239,235,0.34);

  --line: rgba(255,255,255,0.06);
  --line-strong: rgba(232,184,122,0.18);

  --serif-cn: 'Noto Serif SC', 'Source Han Serif SC', serif;
  --serif-en: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --sans-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sans-en: 'Outfit', 'Noto Sans SC', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  /* --- 场景动态层（叠加在上方静态调色板之上，由场景引擎按章改写）---
     默认值 = 序章「冷夜微光 deep night」色板，即色温弧起点，
     与 body[data-chapter="0"] 一致，避免 JS 未跑/首帧闪色。
     具体着色规则集中在 [03] SCENE ENGINE，此处仅定义初值与过渡时长。 */
  --scene-bg: radial-gradient(ellipse 120% 90% at 50% -10%, #0B0C16 0%, var(--bg-deep) 60%, #050509 100%);
  --scene-glow: rgba(126,138,178,0.12);   /* 冷夜微光：一点冷蓝光 */
  --scene-ink-tint: rgba(214,221,238,0.05); /* 近中性偏冷的墨色微调 */
  --light-hue: 222;                         /* 深夜冷蓝色相起点 */
  --scene-tr: 1.2s;                         /* 场景过渡时长；reduced-motion 下归零（[11]，见 R2） */
}

/* ===== [01] BASE & RESET ===== */
/* 全局 reset、body 基底、排版基线、链接/选区等。 */
html { scroll-behavior: smooth; }
body {
  background: var(--scene-bg);
  color: var(--ink);
  font-family: var(--sans-cn);
  line-height: 1.8;
  overflow-x: hidden;
  /* transition 只加在 body 背景（及未来固定光层），不给 :root 整体加 —— T1.2 注意事项。
     时长引用 --scene-tr，reduced-motion 下归零仍切换、只是瞬时（R2）。 */
  transition: background var(--scene-tr) ease;
}

/* ===== [02] GLOBAL LIGHT LAYERS ===== */
/* preloader / .grain / .scroll-progress / .bg-glow(orb×3) / lightCanvas / .cursor-glow。详见 T1.3。
   从 index.html 全局贴层移植：preloader 触发 body.loaded（序章 per-glyph 入场依赖，R7）；
   orb 色值由 index 的硬编码 rgba 改为引用 --scene-glow，随章变色（T1.3 注意事项 / KD-4）；
   lightCanvas 本 task 原样移植，colors 按章着色留给 T5.2。 */

/* —— PRELOADER（开场：一点光，破暗而生）—— */
.preloader {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--bg-deep);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.9s ease, visibility 0.9s;
}
.preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
.pre-core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.pre-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 24px var(--gold), 0 0 80px rgba(232,184,122,0.5);
  animation: preDot 1.4s ease-in-out infinite;
}
.pre-ring {
  position: absolute; top: -25px; left: 50%; margin-left: -30px;
  width: 60px; height: 60px; border-radius: 50%;
  border: 1px solid rgba(232,184,122,0.4);
  animation: preRing 1.4s ease-out infinite;
}
.pre-text {
  font-family: var(--serif-cn); font-weight: 900; font-size: 17px;
  letter-spacing: 12px; text-indent: 12px; color: var(--ink-dim);
  animation: preText 1.6s ease-in-out infinite alternate;
}
@keyframes preDot { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }
@keyframes preRing { from { transform: scale(0.3); opacity: 1; } to { transform: scale(2.1); opacity: 0; } }
@keyframes preText { from { color: var(--ink-dim); } to { color: var(--gold); } }

/* —— 颗粒噪点（base64 SVG ~0.5KB，原样保留）—— */
.grain {
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

/* —— 顶部滚动进度细条 —— */
.scroll-progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0%; z-index: 200;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-light));
  box-shadow: 0 0 14px rgba(232,184,122,0.55);
  transition: width 0.08s linear;
}

/* —— 光标即是光：跟随鼠标的柔光（追光者签名交互）—— */
.cursor-glow {
  position: fixed; left: 0; top: 0; z-index: 3;
  width: 380px; height: 380px; margin: -190px 0 0 -190px;
  border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(232,184,122,0.10), rgba(195,107,94,0.04) 45%, transparent 65%);
  mix-blend-mode: screen;
  opacity: 0; transition: opacity 0.5s;
  will-change: transform;
}
.cursor-glow.on { opacity: 1; }

/* —— 背景光晕 orb×3：色值引用 --scene-glow，随章变色（T1.3）——
   三球保留 index 的暖金/余烬/紫的气质差异：orb-1 直接用 --scene-glow，
   orb-2/orb-3 在 --scene-glow 基础上 color-mix 进 --ember/--accent-violet，
   既随场景重着色，又保留三色层次。 */
.bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-glow .orb {
  position: absolute; border-radius: 50%; filter: blur(130px);
  animation: orbFloat 26s ease-in-out infinite;
}
.bg-glow .orb-1 { width: 640px; height: 640px; background: radial-gradient(circle, var(--scene-glow), transparent 70%); top: -12%; left: -10%; }
.bg-glow .orb-2 { width: 520px; height: 520px; background: radial-gradient(circle, color-mix(in srgb, var(--scene-glow) 70%, var(--ember)), transparent 70%); top: 38%; right: -12%; animation-delay: -8s; }
.bg-glow .orb-3 { width: 480px; height: 480px; background: radial-gradient(circle, color-mix(in srgb, var(--scene-glow) 70%, var(--accent-violet)), transparent 70%); bottom: -8%; left: 26%; animation-delay: -16s; }
@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(70px,-50px) scale(1.1); }
  66% { transform: translate(-40px,60px) scale(0.92); }
}

/* —— 向光金粉 canvas —— */
.light-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; display: block;
  opacity: var(--light-opacity, 1);
  transition: opacity .35s linear;
}

/* ===== [03] SCENE ENGINE ===== */
/* body[data-chapter="N"] 各章色板（--scene-bg/--scene-glow/--scene-ink-tint/--light-hue）
   + 背景与光层的 transition + .chapter 通用 min-height。详见 T1.4 / KD-1 / KD-2。

   机制：sceneEngine IIFE 单 observer 判定当前章 → 写 body.dataset.chapter；
   下方 11 组规则把每章色板集中定义；body 背景在 [01] 已对 --scene-bg 做 transition，
   固定光层（orb/scene-tint）在此对 --scene-glow/--scene-ink-tint 做 transition。
   所有色值从既有调色板派生（color-mix / 低透明度叠加），不引入调色板外的硬编码新色相。 */

/* —— .chapter 通用骨架（min-height 章高保障，应对短章双命中 UX-002）——
   svh 在旧 Safari/旧 Android WebView 不支持；CSS 同属性后写覆盖前写：
   支持 svh 的取 svh、不支持的回落 vh，无需 @supports。
   用 min-height（非 height）：横屏矮屏内容超一屏时仍可撑高、不裁切（与 T5.3 一致）。 */
.chapter {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
}

/* —— 固定光层随章过渡：orb 的色相来自 --scene-glow，
   故对 --scene-glow 派生的 background 做 transition；--scene-ink-tint 叠层同理。
   transition 时长统一引用 --scene-tr（reduced-motion 下 [11] 归零，切换瞬时不"动"，R2）。 */
.bg-glow .orb { transition: background var(--scene-tr) ease; }

/* 场景墨色微调叠层（--scene-ink-tint）：一层极淡的全屏覆盖，随章微调整体冷暖。
   固定贴层、不挡交互、不参与合成开销热点（单层 radial，opacity 级）。 */
.scene-tint {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 140% 100% at 50% 0%, var(--scene-ink-tint), transparent 70%);
  transition: background var(--scene-tr) ease;
}

/* —— 11 组章色板（色温弧：序章冷夜 → 暖土黄 → 黎明 → 正午金 → 赤焰
   → 靛紫深空 → 青银 → 金橙 → 紫金交汇 → 满金）——
   每组改写 --scene-bg / --scene-glow / --scene-ink-tint / --light-hue 四个动态变量；
   body 背景与固定光层对其 transition，JS 只切 data-chapter（KD-1）。
   色值全部从既有调色板派生：--gold/--gold-light/--gold-deep/--ember/
   --accent-violet/--accent-teal/--accent-sage + --bg-deep，
   用 color-mix 插值或低透明度叠加，不写调色板外的裸色相。
   data-chapter="0" 与 :root 默认值一致（[00]），保证 JS 未跑/首帧不闪色。 */

/* 序章 · 追光者 —— 冷夜微光 deep night（色温弧起点，最冷一点光） */
body[data-chapter="0"] {
  --scene-bg: radial-gradient(ellipse 120% 90% at 50% -10%, #0B0C16 0%, var(--bg-deep) 60%, #050509 100%);
  --scene-glow: rgba(126,138,178,0.12);
  --scene-ink-tint: color-mix(in srgb, var(--accent-violet) 14%, transparent);
  --light-hue: 222;
}
/* 一 · 底色 —— 暖土黄（暖意初生，土黄基底） */
body[data-chapter="1"] {
  --scene-bg: radial-gradient(ellipse 120% 90% at 50% -8%, color-mix(in srgb, var(--gold-deep) 24%, var(--bg-deep)) 0%, var(--bg-deep) 62%, #06060B 100%);
  --scene-glow: color-mix(in srgb, var(--gold-deep) 55%, transparent);
  --scene-ink-tint: color-mix(in srgb, var(--gold-deep) 12%, transparent);
  --light-hue: 38;
}
/* 二 · 来路 —— 黎明渐暖（地平线初光，暖金上扬） */
body[data-chapter="2"] {
  --scene-bg: radial-gradient(ellipse 120% 95% at 50% 4%, color-mix(in srgb, var(--gold) 18%, var(--bg-deep)) 0%, var(--bg-deep) 58%, #07060A 100%);
  --scene-glow: color-mix(in srgb, var(--gold) 50%, var(--ember) 10%);
  --scene-ink-tint: color-mix(in srgb, var(--gold) 10%, transparent);
  --light-hue: 44;
}
/* 三 · 此身 —— 正午金（最盛的暖金，光线最强） */
body[data-chapter="3"] {
  --scene-bg: radial-gradient(ellipse 110% 90% at 50% -6%, color-mix(in srgb, var(--gold) 26%, var(--bg-deep)) 0%, var(--bg-deep) 60%, #08070C 100%);
  --scene-glow: color-mix(in srgb, var(--gold) 62%, var(--gold-light) 18%);
  --scene-ink-tint: color-mix(in srgb, var(--gold-light) 12%, transparent);
  --light-hue: 48;
}
/* 四 · 信念 —— 赤焰（ember 提亮，光效最"热"，凤凰之火） */
body[data-chapter="4"] {
  --scene-bg: radial-gradient(ellipse 115% 92% at 50% -4%, color-mix(in srgb, var(--ember) 30%, var(--bg-deep)) 0%, var(--bg-deep) 58%, #0A0608 100%);
  --scene-glow: color-mix(in srgb, var(--ember) 60%, var(--gold) 20%);
  --scene-ink-tint: color-mix(in srgb, var(--ember) 16%, transparent);
  --light-hue: 14;
}
/* 五 · 远方 —— 靛紫深空（光效转星空，冷紫深邃） */
body[data-chapter="5"] {
  --scene-bg: radial-gradient(ellipse 120% 95% at 50% -10%, color-mix(in srgb, var(--accent-violet) 26%, var(--bg-deep)) 0%, var(--bg-deep) 56%, #050410 100%);
  --scene-glow: color-mix(in srgb, var(--accent-violet) 55%, transparent);
  --scene-ink-tint: color-mix(in srgb, var(--accent-violet) 18%, transparent);
  --light-hue: 264;
}
/* 六 · 系统 —— 青银冷静（仪表辉，青银工程感） */
body[data-chapter="6"] {
  --scene-bg: radial-gradient(ellipse 120% 92% at 50% -8%, color-mix(in srgb, var(--accent-teal) 22%, var(--bg-deep)) 0%, var(--bg-deep) 58%, #04090C 100%);
  --scene-glow: color-mix(in srgb, var(--accent-teal) 52%, transparent);
  --scene-ink-tint: color-mix(in srgb, var(--accent-teal) 14%, transparent);
  --light-hue: 188;
}
/* 七 · 造物 —— 金橙工坊（流光，暖金橙锻造感） */
body[data-chapter="7"] {
  --scene-bg: radial-gradient(ellipse 115% 90% at 50% -6%, color-mix(in srgb, var(--gold-deep) 30%, var(--bg-deep)) 0%, var(--bg-deep) 58%, #0A0705 100%);
  --scene-glow: color-mix(in srgb, var(--gold) 50%, var(--ember) 22%);
  --scene-ink-tint: color-mix(in srgb, var(--gold-deep) 14%, transparent);
  --light-hue: 33;
}
/* 八 · 同行 —— 紫金交汇（双色光效交汇，呼应"同行"） */
body[data-chapter="8"] {
  --scene-bg: radial-gradient(ellipse 120% 95% at 50% -8%, color-mix(in srgb, var(--accent-violet) 20%, var(--bg-deep)) 0%, color-mix(in srgb, var(--gold-deep) 8%, var(--bg-deep)) 55%, #07060E 100%);
  --scene-glow: color-mix(in srgb, var(--accent-violet) 40%, var(--gold) 28%);
  --scene-ink-tint: color-mix(in srgb, var(--accent-violet) 12%, transparent);
  --light-hue: 286;
}
/* 终章 · 成为 —— 满金收束（万丈光，最盛满金，色温弧终点） */
body[data-chapter="9"] {
  --scene-bg: radial-gradient(ellipse 120% 100% at 50% -4%, color-mix(in srgb, var(--gold) 34%, var(--bg-deep)) 0%, color-mix(in srgb, var(--gold-deep) 14%, var(--bg-deep)) 52%, #0A0805 100%);
  --scene-glow: color-mix(in srgb, var(--gold-light) 60%, var(--gold) 30%);
  --scene-ink-tint: color-mix(in srgb, var(--gold-light) 16%, transparent);
  --light-hue: 46;
}

/* ===== [04] NAVIGATION ===== */
/* 桌面 .chapter-rail 圆点列 + 顶部进度条 + 移动端 .chapter-bar 章名条。详见 KD-5。 */

/* ===== [05] CHAPTER SHELL ===== */
/* .chapter 通用骨架（min-height、章号眉题 .section-label + .section-title + .divider）。详见 T2.1。 */

/* ===== [06] REVEAL & ANIMATIONS ===== */
/* .reveal / .reveal-stagger 入场 + 共享 @keyframes 定义。
   .reveal/.reveal-stagger 移植留给 T2.1；此处先放跨章共享的入场 keyframes
   （逐字复制 index：fadeUp/fadeDown/glyphIn），序章 [08] 与后续各章入场编排复用。 */
@keyframes fadeUp { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glyphIn {
  from { opacity: 0; transform: translateY(70px) scale(0.94); filter: blur(14px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

/* ===== [07] SHARED COMPONENTS ===== */
/* .info-card / .metric-cell / .practice-row / .tilt / .manifesto-row 等跨章复用组件。 */

/* ===== [08] CHAPTERS ===== */
/* 各章节专属样式（#ch0 序章 … #ch9 终章），按章号顺序排列。 */

/* —— #ch0 序章 · 追光者（破暗开场 · 长廊入口）——
   重新演绎，不复制 index hero 的 DOM（PRD 序章行硬约束）：
   文案取自 index hero（姓名/别名/使命/★座右铭），但版式是新的「长廊入口」气质——
   纵向门轴构图：一点光（放大 preloader 光点语汇）→ 姓名 per-glyph 自下破暗渐显
   → 别名/使命作门内引语 → ★座右铭嵌入「门楣」框线，作为走进长廊的第一道门。
   入场依赖 body.loaded（preloader IIFE 已移植，R7）；data-temp="night" = 色温弧最冷起点。 */
.ch0 {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 120px 24px 96px; overflow: hidden;
}
.ch0-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 760px;
}

/* 破暗的一点光：放大 preloader .pre-dot 语汇，作为长廊入口的源点 */
.ch0-spark {
  position: relative; width: 14px; height: 14px; margin-bottom: 54px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 26px var(--gold), 0 0 90px var(--gold-glow), 0 0 150px var(--gold-glow);
  animation: ch0Spark 4.5s ease-in-out infinite;
}
.ch0-spark::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 64px; height: 64px; margin: -32px 0 0 -32px;
  border-radius: 50%; border: 1px solid rgba(232,184,122,0.28);
  animation: ch0Ripple 4.5s ease-out infinite;
}
/* 从光点垂落的一束细光，把视线引入长廊（纯 transform 的 scaleY 呼吸） */
.ch0-spark::after {
  content: ''; position: absolute; top: 14px; left: 50%; margin-left: -0.5px;
  width: 1px; height: 46px;
  background: linear-gradient(180deg, var(--gold), transparent);
  transform-origin: top; opacity: 0.7;
}

/* 入口眉题：长廊的门牌号（英文眉题规约） */
.ch0-eyebrow {
  font-family: var(--serif-en); font-style: italic;
  font-size: clamp(13px, 1.8vw, 17px);
  color: var(--ink-dim); letter-spacing: 5px; margin-bottom: 26px;
}
.ch0-eyebrow .ord { color: var(--gold); font-style: normal; letter-spacing: 3px; }

<script>
/* 各功能拆为独立自启 IIFE 模块（沿用 index 风格，无统一 init()）：
   preloader / sceneEngine / revealObserver / chapterRail / lightCanvas / countUp / timeline / copyWechat。
   详见 tech-design KD-6。后续 task 在此填充。 */

/* —— 标记 JS 已启用（序章 per-glyph 入场编排依赖 body.js 设初始隐藏态，沿用 index 第 1797 行）——
   reduced-motion 不影响此标记：降级在 [11] 把隐藏态/动画覆盖为直接可见。 */
document.body.classList.add('js');

/* —— preloader：一点光开场 → body.loaded（序章 per-glyph 入场依赖此机制，R7）——
   依赖：#preloader。reduced-motion 下 delay 归零，body.loaded 立即添加，入场不丢。 */
(function preloader() {
  const pre = document.getElementById('preloader');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const delay = reduced ? 0 : 1100;
  setTimeout(() => {
    if (pre) pre.classList.add('done');
    document.body.classList.add('loaded');
  }, delay);
})();

/* —— sceneEngine：chapter-driven 场景引擎（全页技术核心，KD-1 / KD-2 / T1.4）——
   职责：单个 IntersectionObserver 监听全部 .chapter，判定"当前章"，
   只把章号写到 body.dataset.chapter；所有视觉变换由 CSS 对 --scene-* 做 transition 完成。
   依赖：.chapter 元素（带 data-chapter）+ [03] 的 body[data-chapter="N"] 色板规则。

   判定机制：
   · rootMargin '-45% 0px -45% 0px' → 只有穿过视口中线（屏幕中带）的 section 命中，避免边界抖动。
   · 回调里维护"当前所有 isIntersecting 的 .chapter"集合，取 intersectionRatio 最大者为候选章号
     （同帧多 entry 命中时必须选 ratio 最大者，否则边界抖动）。
   · 150ms 尾沿去抖（trailing debounce）：候选暂存 + 清上一个 setTimeout，150ms 后若与已写入值
     不同才真正写 dataset.chapter —— 同帧/短时连续命中只触发一次写入、一次 1.2s transition，
     杜绝背景在过渡期内连跳两个色温值的闪烁（UX-002 / R3）。

   安全性：当前页面尚无 .chapter（序章 T1.5 才建），observer 监听 0 个目标不抛错；
   data-chapter 维持 HTML 初值 0，背景仍呈现序章色板（JS 未跑也有背景，KD-1）。
   reduced-motion 下逻辑不变（去抖保留），仅 CSS transition 时长在 [11] 归零、切换瞬时（R2）。 */
(function sceneEngine() {
  const chapters = document.querySelectorAll('.chapter');
  if (!chapters.length) return; // 零监听目标：安全退出，data-chapter 维持初值 0

  // 记录每个 .chapter 当前的 intersectionRatio（仅 isIntersecting 者计入候选）
  const ratios = new Map();
  let debounceId = 0;

  function commit() {
    debounceId = 0;
    // 在当前所有 isIntersecting 的章里取 ratio 最大者
    let bestCh = null, bestRatio = -1;
    ratios.forEach((ratio, ch) => {
      if (ratio > bestRatio) { bestRatio = ratio; bestCh = ch; }
    });
    if (bestCh == null) return; // 中带内暂无命中章（例如章间空隙），保持上一章
    if (document.body.dataset.chapter !== bestCh) {
      document.body.dataset.chapter = bestCh; // O(1) 写入，视觉变换交给 CSS transition
    }
  }

  const obs = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const ch = entry.target.dataset.chapter;
      if (ch == null) return;
      if (entry.isIntersecting) {
        ratios.set(ch, entry.intersectionRatio);
      } else {
        ratios.delete(ch); // 移出中带 → 退出候选集合
      }
    });
    // 尾沿去抖：清上一个待提交，150ms 后只提交一次（吞掉同帧/边界连续命中）
    if (debounceId) clearTimeout(debounceId);
    debounceId = setTimeout(commit, 150);
  }, {
    // 只命中穿过视口中线者，避免相邻章在边界反复抖动（KD-2）
    rootMargin: '-45% 0px -45% 0px',
    // 多档阈值让 ratio 在中带内有足够分辨率，选最大者更稳
    threshold: [0, 0.25, 0.5, 0.75, 1]
  });
  chapters.forEach((ch) => obs.observe(ch));
})();

/* —— cursorGlow：光标即是光，跟随鼠标的柔光（追光者签名交互）——
   依赖：.cursor-glow。仅 hover+fine 指针生效；reduced-motion / 触屏直接 return。 */
(function cursorGlow() {
  const glow = document.querySelector('.cursor-glow');
  if (!glow) return;
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let tx = -400, ty = -400, x = -400, y = -400, active = false, rafId = 0;
  function loop() {
    x += (tx - x) * 0.1;
    y += (ty - y) * 0.1;
    glow.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('mousemove', (e) => {
    tx = e.clientX; ty = e.clientY;
    if (!active) { active = true; x = tx; y = ty; glow.classList.add('on'); loop(); }
  });
  document.addEventListener('mouseleave', () => {
    glow.classList.remove('on');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && rafId) { cancelAnimationFrame(rafId); rafId = 0; active = false; }
  });
})();

/* —— scrollProgress：顶部细进度条宽度跟随滚动（全页唯一 scroll 监听，passive）——
   依赖：.scroll-progress。heroInner 视差仅在序章元素存在时生效（T1.5 前为空 → 守卫跳过）。 */
(function scrollProgress() {
  const progressBar = document.querySelector('.scroll-progress');
  if (!progressBar) return;
  const heroInner = document.querySelector('.hero-inner');
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
    progressBar.style.width = (scrolled * 100) + '%';
    if (heroInner && window.scrollY < window.innerHeight) {
      const y = window.scrollY;
      heroInner.style.transform = 'translateY(' + (y * 0.22) + 'px)';
      heroInner.style.opacity = Math.max(0, 1 - y / (window.innerHeight * 0.85)).toFixed(3);
    }
  }, { passive: true });
})();

/* —— lightCanvas：向光金粉粒子（追光者签名画面）——
   依赖：#lightCanvas。本 task 原样移植；colors 按章着色 + 密度分级停机留给 T5.2。
   reduced-motion 整体 return（保留既有降级逻辑）。 */
(function lightCanvas() {
  const c = document.getElementById('lightCanvas');
  if (!c) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const ctx = c.getContext('2d');
  const hover = !matchMedia('(hover: none)').matches;
  let w = 0, h = 0, dpr = 1;
  let particles = [];
  let mouseX = 0, mouseY = 0;
  let targetX = -9999, targetY = -9999;
  let mouseActive = false;
  let opacity = 1;
  let running = false;
  let rafId = 0;

  // 70% 金 · 20% 余烬 · 10% 浅金（T5.2 将改为按章着色）
  const colors = [
    'rgba(232,184,122,','rgba(232,184,122,','rgba(232,184,122,','rgba(232,184,122,',
    'rgba(232,184,122,','rgba(232,184,122,','rgba(232,184,122,',
    'rgba(195,107,94,','rgba(195,107,94,',
    'rgba(244,217,168,'
  ];

  function particleCount() {
    if (w < 480) return 22;
    if (w < 768) return 30;
    return 52;
  }

  function spawn(initial) {
    return {
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + Math.random() * 30,
      r: 0.6 + Math.pow(Math.random(), 2) * 1.7,
      vx: (Math.random() - 0.5) * 0.1,
      vy: -(0.12 + Math.random() * 0.3),
      a: 0.32 + Math.random() * 0.42,
      phase: Math.random() * Math.PI * 2,
      freq: 0.0015 + Math.random() * 0.002,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const n = particleCount();
    if (particles.length !== n) {
      particles = Array.from({ length: n }, () => spawn(true));
    }
  }

  function frame(t) {
    if (!running) { rafId = 0; return; }
    ctx.clearRect(0, 0, w, h);
    if (opacity < 0.02) { rafId = requestAnimationFrame(frame); return; }
    ctx.globalCompositeOperation = 'lighter';

    if (mouseActive) {
      targetX += (mouseX - targetX) * 0.12;
      targetY += (mouseY - targetY) * 0.12;
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (hover && mouseActive && targetX > -9000) {
        const dx = targetX - p.x;
        const dy = targetY - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 40000) { // 200^2 吸附半径
          const d = Math.sqrt(d2) + 0.01;
          p.vx += (dx / d) * 0.018;
          p.vy += (dy / d) * 0.018;
        }
      }
      p.vx *= 0.985;
      p.vy *= 0.985;
      if (p.vy > -0.05) p.vy = -0.05; // 维持向上漂
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -12 || p.x < -50 || p.x > w + 50) {
        Object.assign(p, spawn(false));
      }
      const alpha = (p.a * (0.6 + 0.4 * Math.sin(t * p.freq + p.phase))).toFixed(3);
      ctx.fillStyle = p.color + alpha + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    if (!running) {
      running = true;
      if (!rafId) rafId = requestAnimationFrame(frame);
    }
  }
  function stop() { running = false; }

  if (hover) {
    const hero = document.querySelector('.hero');
    if (hero) {
      hero.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!mouseActive) { targetX = mouseX; targetY = mouseY; }
        mouseActive = true;
      });
      hero.addEventListener('mouseleave', () => { mouseActive = false; });
    }
  }

  function updateOpacity() {
    const heroH = window.innerHeight;
    const scrolled = window.scrollY;
    opacity = Math.max(0, 1 - scrolled / heroH);
    document.documentElement.style.setProperty('--light-opacity', opacity.toFixed(3));
    if (opacity < 0.02) stop(); else start();
  }
  window.addEventListener('scroll', updateOpacity, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') stop();
    else updateOpacity();
  });
  window.addEventListener('resize', resize);

  resize();
  updateOpacity();
  start();
})();
</script>
</body>
</html>
