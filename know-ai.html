<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>不是替代你，是放大你 · 关于 AI 的一封信</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   AI 重要性站点 — 全局样式
   color: 暖奶白 + 墨黑 + 朱红 / 钴蓝 / 酸柠檬
   type:  Space Grotesk + Sora + JetBrains Mono
          Noto Serif SC + Noto Sans SC
   ============================================================ */

:root {
  --bg: #FBFAF5;
  --bg-2: #F2EFE5;
  --bg-paper: #FFFEFA;
  --ink: #0E0E12;
  --ink-soft: #5A5A62;
  --ink-mute: #9A9A9F;
  --line: #E4E0D2;
  --line-strong: #C9C4B3;

  --acc-red: #FF4A1F;
  --acc-blue: #2C42F0;
  --acc-lime: #E6FF55;
  --acc-blue-soft: #DDE2FF;
  --acc-red-soft: #FFE0D6;
  --acc-lime-soft: #F4FFB3;

  --serif: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --sans-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --display: "Space Grotesk", "Noto Sans SC", sans-serif;
  --text: "Sora", "Noto Sans SC", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: var(--text);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

::selection { background: var(--acc-lime); color: var(--ink); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

.grain::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMCAwICAwIDAgMCAwLjMyIDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");
  opacity: 0.35;
  mix-blend-mode: multiply;
  z-index: 9998;
}

/* ============== Chrome / nav ============== */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 18px 32px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  mix-blend-mode: difference;
  filter: invert(1);
}
.topnav .brand { display: flex; gap: 10px; align-items: center; }
.topnav .brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--acc-red);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}
.topnav .meta { display: flex; gap: 24px; }

/* Side rail */
.rail {
  position: fixed;
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 90;
  display: flex; flex-direction: column; gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
}
.rail a {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink-mute);
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s;
}
.rail a::before {
  content: "";
  width: 18px; height: 1px;
  background: var(--ink-mute);
  transition: width 0.25s, background 0.25s;
}
.rail a:hover, .rail a.active { color: var(--ink); }
.rail a.active::before { width: 36px; background: var(--acc-red); }

/* ============== Section base ============== */
section.chapter {
  position: relative;
  min-height: 100vh;
  padding: 120px 8vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.eyebrow .num {
  background: var(--ink);
  color: var(--bg);
  padding: 3px 8px;
  font-weight: 600;
}
.eyebrow .bar {
  display: inline-block;
  width: 40px; height: 1px;
  background: var(--ink-soft);
}

h1.display, h2.display {
  font-family: var(--serif);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 0.96;
  margin: 0;
  text-wrap: balance;
}
h2.display { font-size: clamp(48px, 7vw, 112px); }
h1.display { font-size: clamp(60px, 9vw, 160px); }

.kicker {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -0.01em;
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  color: var(--ink);
  max-width: 60ch;
  text-wrap: balance;
}
.body-lg {
  font-family: var(--text);
  font-size: clamp(16px, 1.15vw, 20px);
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 64ch;
}
.body {
  font-family: var(--text);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink-soft);
}
.label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.tag {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.red { background: var(--acc-red); color: white; border-color: var(--acc-red); }
.tag.blue { background: var(--acc-blue); color: white; border-color: var(--acc-blue); }
.tag.lime { background: var(--acc-lime); color: var(--ink); border-color: var(--acc-lime); }

.divider { height: 1px; background: var(--line); width: 100%; }

/* Reveal animation */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.9s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1);
}
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: 0.08s; }
.reveal.d2 { transition-delay: 0.16s; }
.reveal.d3 { transition-delay: 0.24s; }
.reveal.d4 { transition-delay: 0.32s; }
.reveal.d5 { transition-delay: 0.40s; }
.reveal.d6 { transition-delay: 0.48s; }

/* ============== HERO — editorial cover ============== */
.hero {
  min-height: 100vh;
  position: relative;
  padding: 28px 6vw 28px;
  display: grid;
  grid-template-rows: auto 1px 1fr 1px auto;
  gap: 0;
  background: var(--bg);
}

.hero-band {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 24px;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 16px 0;
}
.hero-band .band-l { display: flex; align-items: center; gap: 10px; }
.hero-band .band-c { text-align: center; color: var(--ink); font-weight: 500; letter-spacing: 0.22em; }
.hero-band .band-r { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.hero-band .sep { color: var(--line-strong); }
.hero-band .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--acc-red);
  animation: pulse 1.8s ease-in-out infinite;
}

.hero-rule { height: 1px; background: var(--ink); }

.hero-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 64px;
  align-items: start;
  padding: 80px 0 60px;
  align-content: center;
}

.hero-left {
  display: flex;
  flex-direction: column;
  gap: 44px;
  min-width: 0;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.hero-eyebrow .num {
  background: var(--ink);
  color: var(--bg);
  padding: 4px 9px;
  font-weight: 600;
}

.hero-title {
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(56px, 10.5vw, 168px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
}
.hero-title .strike {
  position: relative;
  display: inline-block;
  color: var(--ink-mute);
}
.hero-title .strike::after {
  content: "";
  position: absolute;
  left: -2%; right: -2%;
  top: 52%;
  height: 5px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  animation: drawIn 0.9s 0.7s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes drawIn { to { transform: scaleX(1); } }
.hero-title .dash {
  display: inline-block;
  color: var(--ink-soft);
  font-weight: 400;
  margin: 0 0.05em;
}
.hero-title .accent {
  color: var(--acc-red);
  font-style: italic;
}

.hero-sub {
  font-family: var(--text);
  font-size: clamp(16px, 1.35vw, 20px);
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 52ch;
  margin: 0;
}
.hero-sub strong { color: var(--ink); font-weight: 600; }

.hero-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.hero-foot .tag {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  color: var(--ink-soft);
}
.hero-foot .tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.hero-side {
  display: flex;
  flex-direction: column;
  gap: 32px;
  border-left: 1px solid var(--line-strong);
  padding-left: 28px;
  align-self: stretch;
}
.hero-side .side-block { display: flex; flex-direction: column; gap: 10px; }
.hero-side .side-block .k {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.hero-side .side-block .v {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
}
.hero-side .side-block .v em { font-style: italic; color: var(--acc-red); font-weight: 700; }
.hero-side .side-block .v.mono {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.04em;
}

.hero-toc {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 0;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-toc .toc-left { display: flex; gap: 28px; flex-wrap: wrap; }
.hero-toc .toc-left a {
  display: inline-flex; align-items: baseline; gap: 8px;
  color: var(--ink);
  text-decoration: none;
  transition: color 0.2s;
}
.hero-toc .toc-left a span:first-child { color: var(--ink-mute); font-size: 10.5px; }
.hero-toc .toc-left a:hover { color: var(--acc-red); }
.hero-toc .toc-left a:hover span:first-child { color: var(--acc-red); }

.hero-toc .toc-scroll {
  display: inline-flex; align-items: center; gap: 12px;
  color: var(--ink);
  text-decoration: none;
}
.hero-toc .toc-scroll .arrow {
  display: inline-block;
  width: 26px; height: 1px;
  background: var(--ink);
  position: relative;
  animation: scrollPulse 2.2s ease-in-out infinite;
}
.hero-toc .toc-scroll .arrow::after {
  content: "";
  position: absolute;
  right: 0; top: -3px;
  width: 7px; height: 7px;
  border-right: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  transform: rotate(-45deg);
}
@keyframes scrollPulse {
  0%, 100% { transform: translateX(0); opacity: 1; }
  50% { transform: translateX(6px); opacity: 0.4; }
}

/* ============== Chapter 1 — 分水岭 ============== */
.ch1 { background: var(--bg); padding-top: 160px; padding-bottom: 160px; }
.ch1 .head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
  margin-bottom: 96px;
}

.compare-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.compare-card {
  border: 1px solid var(--line);
  background: var(--bg-paper);
  padding: 28px;
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 22px;
  transition: transform 0.4s cubic-bezier(.2,.7,.2,1), border-color 0.3s;
}
.compare-card:hover { transform: translateY(-4px); border-color: var(--ink); }
.compare-card .topline { display: flex; justify-content: space-between; align-items: center; }
.compare-card .domain {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.compare-card .domain .idx { color: var(--acc-red); font-weight: 700; margin-right: 8px; }
.compare-card .task {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.15;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.compare-card .ba {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: stretch;
}
.compare-card .ba .side {
  border: 1px dashed var(--line-strong);
  padding: 16px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
.compare-card .ba .side.after {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
}
.compare-card .ba .side .when {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.7;
}
.compare-card .ba .side .val {
  font-family: var(--display);
  font-weight: 700;
  font-size: 28px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.compare-card .ba .side .unit { font-family: var(--text); font-size: 12.5px; opacity: 0.8; }
.compare-card .ba .arrow {
  align-self: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--acc-red);
  letter-spacing: 0.1em;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.compare-card .ba .arrow .glyph {
  display: inline-block;
  width: 32px; height: 12px;
  position: relative;
}
.compare-card .ba .arrow .glyph::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 75%; height: 1.5px;
  background: var(--acc-red);
  transform: translateY(-50%);
}
.compare-card .ba .arrow .glyph::after {
  content: "";
  position: absolute;
  right: 0; top: 50%;
  width: 8px; height: 8px;
  border-right: 1.5px solid var(--acc-red);
  border-top: 1.5px solid var(--acc-red);
  transform: translateY(-50%) rotate(45deg);
}
.compare-card .delta {
  display: flex; justify-content: space-between; align-items: baseline;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.compare-card .delta .x {
  font-family: var(--display);
  font-weight: 700;
  font-size: 36px;
  letter-spacing: -0.02em;
  color: var(--acc-red);
}
.compare-card .delta .x sup { font-size: 14px; vertical-align: super; color: var(--ink-soft); }
.compare-card .delta .note {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: right;
  max-width: 22ch;
}

.ch1 .pullquote {
  margin-top: 96px;
  padding-top: 56px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 48px;
  align-items: start;
}
.ch1 .pullquote .label-col .label { display: block; margin-bottom: 12px; }
.ch1 .pullquote q {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(36px, 4.5vw, 64px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink);
  quotes: none;
  display: block;
  text-wrap: balance;
}
.ch1 .pullquote q::before, .ch1 .pullquote q::after { content: ""; }
.ch1 .pullquote .hl { background: var(--acc-lime); padding: 0 0.1em; }

/* ============== Chapter 2 — Abilities ============== */
.ch2 {
  background: var(--ink);
  color: var(--bg);
  padding-top: 160px;
  padding-bottom: 160px;
  position: relative;
  overflow: hidden;
}
.ch2::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
}
.ch2 .head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
  margin-bottom: 88px;
  position: relative;
}
.ch2 .head h2 { color: var(--bg); }
.ch2 .head .eyebrow { color: rgba(251,250,245,0.6); }
.ch2 .head .eyebrow .num { background: var(--bg); color: var(--ink); }
.ch2 .head .eyebrow .bar { background: rgba(251,250,245,0.4); }
.ch2 .head .blurb { color: rgba(251,250,245,0.7); }

.abilities {
  position: relative;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 56px;
  align-items: start;
}
.ab-list {
  display: flex; flex-direction: column;
  border-top: 1px solid rgba(251,250,245,0.15);
  position: sticky;
  top: 100px;
}
.ab-list .item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 4px;
  border-bottom: 1px solid rgba(251,250,245,0.15);
  cursor: pointer;
  transition: padding-left 0.3s, color 0.3s;
  color: rgba(251,250,245,0.55);
}
.ab-list .item:hover { color: var(--bg); }
.ab-list .item.active {
  color: var(--bg);
  padding-left: 16px;
  background: linear-gradient(to right, rgba(255,74,31,0.18), transparent);
  border-left: 2px solid var(--acc-red);
}
.ab-list .item .num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; opacity: 0.7; }
.ab-list .item .name { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
.ab-list .item .en { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; opacity: 0.5; text-transform: uppercase; }

.ab-stage {
  border: 1px solid rgba(251,250,245,0.18);
  background: #18181C;
  min-height: 600px;
  position: relative;
  overflow: hidden;
}
.ab-stage .frame {
  position: absolute;
  inset: 0;
  padding: 36px;
  display: flex; flex-direction: column; gap: 24px;
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
}
.ab-stage .frame.show { opacity: 1; pointer-events: auto; }

.ab-stage .topbar {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(251,250,245,0.5);
}
.ab-stage .topbar .right { display: flex; gap: 14px; align-items: center; }
.ab-stage .topbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc-lime); }

.ab-stage h3.fname {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 42px;

/* ============== Chapter 3 — Pathway ============== */

.step-row {

}

.step-row .row-body .name-block .zh { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); }

/* ============== Responsive ============== */
@media (max-width: 1024px) {
  .rail { display: none; }
  .hero-main { grid-template-columns: 1fr; gap: 40px; padding: 56px 0 40px; }

  .ch3 .floor { grid-template-columns: 1fr; }
  .ch4 .closing { grid-template-columns: 1fr; }
  .coda .signoff { grid-template-columns: 1fr; }

  <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.15 }
    );
    el.querySelectorAll('.reveal').forEach((n) => io.observe(n));
    return () => io.disconnect();
  }, []);
  return ref;
}

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const onScroll = () => {
      const mid = window.innerHeight * 0.4;
      let current = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.top <= mid) current = id;
      }
      setActive(current);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [ids.join(',')]);
  return active;
}

function useClock() {
  const [t, setT] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setT(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return t;
}

Object.assign(window, { useReveal, useActiveSection, useClock });
  </script>

function Chapter2() {
  const ref = useReveal();
  const [active, setActive] = useState('write');
  useEffect(() => {
    if (!ref.current) return;
    let id;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          if (!id) {
            id = setInterval(() => {
              setActive((cur) => {
                const i = ABILITIES.findIndex((a) => a.key === cur);
                return ABILITIES[(i + 1) % ABILITIES.length].key;
              });
            }, 5200);
          }
        } else {
          if (id) { clearInterval(id); id = null; }
        }
      });
    }, { threshold: 0.3 });
    io.observe(ref.current);
    return () => { io.disconnect(); if (id) clearInterval(id); };
  }, []);

  return (
    <section id="ch2" className="chapter ch2" ref={ref}>
      <div className="head">
        <div className="title reveal">
          <span className="eyebrow"><span className="num">02</span><span>能力 / What Changed</span></span>

          </p>
        </div>
      </div>

      <div className="abilities">
        <AbilityList active={active} onSelect={setActive} />

          <DemoWrite active={active === 'write'} />
          <DemoDesign active={active === 'design'} />
          <DemoCode active={active === 'code'} />
          <DemoAgent active={active === 'agent'} />

        </div>
      </div>
    </section>
  );
}
