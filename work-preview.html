<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>工作页设计对照</title><style>html,body,iframe{display:block;margin:0;width:100%;height:100%;border:0}body{background:#232824}</style></head>
<body><iframe src="system.html#work" title="工作页设计对照"></iframe>
<script>
const frame=document.querySelector('iframe');
let attached=null;
function mountWhenReady(){
  const doc=frame.contentDocument;
  if(!doc||doc===attached||!doc.querySelector('#work .work-intro')||!doc.querySelector('#work .room-heading'))return;
  const style=doc.createElement('style');style.textContent=".work-demo-switch{display:flex;align-items:center;gap:0;margin:0 0 14px auto;width:max-content;border:1px solid var(--rule);border-radius:5px;padding:2px}\n.work-demo-switch button{font:500 13px/1.4 system-ui,sans-serif;color:var(--quiet);background:none;border:0;padding:9px 14px;cursor:pointer;border-radius:3px}\n.work-demo-switch button[aria-pressed=\"true\"]{color:var(--paper);background:var(--ink)}\n.work-demo-switch button:focus-visible,#work.work-edition a:focus-visible{outline:2px solid var(--metal);outline-offset:-2px}\n#work.work-edition{--accent:#f0c598;--cover:#303d36;--cover-ink:#faf4e7;--muted-cover:#e4e4cf}\n[data-theme=\"light\"] #work.work-edition{--accent:#805134;--cover:#e9e5d8;--cover-ink:#212e28;--muted-cover:#47574e}\n#work.work-edition .room-heading{display:grid;grid-template-columns:1.12fr 1fr;grid-template-rows:auto auto;align-content:center;align-items:end;justify-content:stretch;position:relative;min-height:clamp(235px,21vw,310px);padding:clamp(25px,4vw,56px);border:0;background:var(--cover);gap:18px 0}\n#work.work-edition .room-heading .section-title{grid-column:1;grid-row:1;display:flex;gap:15px;align-items:baseline;font:600 clamp(54px,6.5vw,93px)/1.08 var(--serif);letter-spacing:-.065em;color:var(--cover-ink);white-space:nowrap}\n#work.work-edition .room-heading .section-label{font:italic 400 clamp(23px,3vw,40px)/1 Georgia,serif;letter-spacing:-.055em;color:var(--muted-cover);margin:0;text-transform:none}\n#work.work-edition .room-heading .room-land{position:absolute;inset:0 0 0 55%;background:var(--work-photo) 52% 54%/cover no-repeat;mask-image:none}\n#work.work-edition .work-intro{grid-column:1;grid-row:2;max-width:23em;margin:0;padding:0 14px 0 1px;font:400 clamp(15px,1.25vw,18px)/1.8 system-ui,sans-serif;color:var(--muted-cover)}\n#work.work-edition .learn-nav{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0;background:transparent;border-bottom:1px solid var(--rule)}\n#work.work-edition .learn-nav a{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:20px clamp(10px,2vw,28px);min-height:54px;font:600 clamp(19px,1.75vw,24px)/1.25 var(--serif);border:0;color:var(--quiet)}\n#work.work-edition .learn-nav a[aria-current]{color:var(--ink);box-shadow:inset 0 -3px var(--accent)}\n#work.work-edition .learn-nav a[aria-current]::after{content:'↓';color:var(--accent);font:17px/1 system-ui}\n#work.work-edition .learn-sheet:not([hidden]){display:grid;grid-template-columns:minmax(160px,.48fr) 1fr;gap:clamp(25px,5vw,72px);width:100%;padding:0;margin:clamp(32px,4vw,56px) 0}\n.module-view body[data-module-open=\"true\"] .container:has(>#work.work-edition:not([hidden])){padding-top:var(--module-nav-offset,64px)}\n.module-view .container>#work.work-edition{padding-top:18px}\n#work.work-edition .learn-sheet h2{padding:0;border:0;font:550 clamp(37px,4.3vw,62px)/1.18 var(--serif);letter-spacing:-.045em}\n#work.work-edition .learn-sheet h2 small{display:block;margin:12px 0 0;font:400 16px/1.5 system-ui,sans-serif;color:var(--quiet);letter-spacing:.04em}\n#work.work-edition dl{min-width:0}\n#work.work-edition dl>div{display:block;border:0;border-bottom:1px solid var(--rule);padding:18px 0}\n#work.work-edition dl>div:first-child{padding-top:0}\n#work.work-edition dt{margin-bottom:5px;font:600 clamp(20px,1.9vw,26px)/1.5 var(--serif);color:var(--ink)}\n#work.work-edition dd{font:400 clamp(16px,1.18vw,18px)/1.8 system-ui,sans-serif;max-width:38em}\n@media(max-width:650px){\n #work.work-edition .room-heading{min-height:179px;padding:23px 18px;grid-template-columns:64% 1fr;gap:10px 0}\n #work.work-edition .room-heading .section-title{font-size:48px;gap:8px}\n #work.work-edition .room-heading .section-label{font-size:21px}\n #work.work-edition .room-heading .room-land{left:66%;background-position:51% center}\n #work.work-edition .work-intro{font-size:14px;line-height:1.65;padding-right:4px}\n #work.work-edition .learn-nav a{padding:14px 10px;font-size:18px;min-height:48px}\n #work.work-edition .learn-sheet:not([hidden]){display:block;margin:25px 0 30px}\n #work.work-edition .learn-sheet h2{display:flex;align-items:baseline;gap:10px;font-size:34px;margin-bottom:19px}\n #work.work-edition .learn-sheet h2 small{margin:0;font-size:14px}\n #work.work-edition dl>div{padding:14px 0}\n}\n#work{--work-photo:url(\"assets/life-system/work.webp\")}";doc.head.append(style);
  (function(document){(function installPreview() {
  const room = document.getElementById('work');
  const banner = room.querySelector('.room-heading');
  const intro = room.querySelector('.work-intro');
  const heading = banner.querySelector('h1');
  const english = banner.querySelector('.section-label');
  const controls = document.createElement('div');
  controls.className='work-demo-switch';
  controls.setAttribute('role','group');
  controls.setAttribute('aria-label','工作页设计对照');
  room.prepend(controls);
  const choices = ['当前版','设计稿'].map((name,i)=>{
    const button = document.createElement('button');
    button.type='button';
    button.textContent=name;
    button.onclick=()=>select(i===1);
    controls.append(button);
    return button;
  });
  function select(newEdition) {
    room.classList.toggle('work-edition',newEdition);
    choices.forEach((button,i)=>button.setAttribute('aria-pressed',String((i===1)===newEdition)));
    if(newEdition){heading.append(english);english.setAttribute('aria-hidden','true');banner.append(intro);}
    else{banner.prepend(english);english.removeAttribute('aria-hidden');banner.after(intro);}
  }
  select(true);
})();;})(doc);
  attached=doc;
}
frame.addEventListener('load',mountWhenReady);
setInterval(mountWhenReady,400);
</script></body></html>
