<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>工作页设计对照</title><style>html,body,iframe{display:block;margin:0;width:100%;height:100%;border:0}body{background:#232824}</style></head>
<body><iframe src="system.html#work" title="工作页设计对照"></iframe>
<script>
const frame=document.querySelector('iframe');
let attached=null;
function mountWhenReady(){
  const doc=frame.contentDocument;
  if(!doc||doc===attached||!doc.querySelector('#work .work-intro')||!doc.querySelector('#work .room-heading'))return;
  const style=doc.createElement('style');style.textContent=".work-demo-switch{display:flex;align-items:center;gap:0;margin:0 0 14px auto;width:max-content;border:1px solid var(--rule);border-radius:5px;padding:2px}\n.work-demo-switch button{font:500 13px/1.4 system-ui,sans-serif;color:var(--quiet);background:none;border:0;padding:9px 14px;cursor:pointer;border-radius:3px}\n.work-demo-switch button[aria-pressed=\"true\"]{color:var(--paper);background:var(--ink)}\n.work-demo-switch button:focus-visible,#work.work-edition a:focus-visible{outline:2px solid var(--metal);outline-offset:-2px}\n#work.work-edition{--accent:#f0c598;--cover:#303d36;--cover-ink:#faf4e7;--muted-cover:#e4e4cf}\n[data-theme=\"light\"] #work.work-edition{--accent:#805134;--cover:#e9e5d8;--cover-ink:#212e28;--muted-cover:#47574e}\n#work.work-edition .room-heading{display:grid;grid-template-columns:1.12fr 1fr;grid-template-rows:auto auto;align-content:center;align-items:end;justify-content:stretch;position:relative;min-height:clamp(235px,21vw,310px);padding:clamp(25px,4vw,56px);border:0;background:var(--cover);gap:18px 0}\n#work.work-edition .room-heading .section-title{grid-column:1;grid-row:1;display:flex;gap:15px;align-items:baseline;font:600 clamp(54px,6.5vw,93px)/1.08 var(--serif);letter-spacing:-.065em;color:var(--cover-ink);white-space:nowrap}\n#work.work-edition .room-heading .section-label{font:italic 400 clamp(23px,3vw,40px)/1 Georgia,serif;letter-spacing:-.055em;color:var(--muted-cover);margin:0;text-transform:none}\n#work.work-edition .room-heading .room-land{position:absolute;inset:0 0 0 55%;background:var(--work-photo) 52% 54%/cover no-repeat;mask-image:none}\n#work.work-edition .work-intro{grid-column:1;grid-row:2;max-width:23em;margin:0;padding:0 14px 0 1px;font:400 clamp(15px,1.25vw,18px)/1.8 system-ui,sans-serif;color:var(--muted-cover)}\n#work.work-edition .learn-nav{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0;background:transparent;border-bottom:1px solid var(--rule)}\n#work.work-edition .learn-nav a{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:20px clamp(10px,2vw,28px);min-height:54px;font:600 clamp(19px,1.75vw,24px)/1.25 var(--serif);border:0;color:var(--quiet)}\n#work.work-edition .learn-nav a[aria-current]{color:var(--ink);box-shadow:inset 0 -3px var(--accent)}\n#work.work-edition .learn-nav a[aria-current]::after{content:'↓';color:var(--accent);font:17px/1 system-ui}\n#work.work-edition .learn-sheet:not([hidden]){display:grid;grid-template-columns:minmax(160px,.48fr) 1fr;gap:clamp(25px,5vw,72px);width:100%;padding:0;margin:clamp(32px,4vw,56px) 0}\n.module-view body[data-module-open=\"true\"] .container:has(>#work.work-edition:not([hidden])){padding-top:var(--module-nav-offset,64px)}\n.module-view .container>#work.work-edition{padding-top:18px}\n#work.work-edition .learn-sheet h2{padding:0;border:0;font:550 clamp(37px,4.3vw,62px)/1.18 var(--serif);letter-spacing:-.045em}\n#work.work-edition .learn-sheet h2 small{display:block;margin:12px 0 0;font:400 16px/1.5 system-ui,sans-serif;color:var(--quiet);letter-spacing:.04em}\n#work.work-edition dl{min-width:0}\n#work.work-edition dl>div{display:block;border:0;border-bottom:1px solid var(--rule);padding:18px 0}\n#work.work-edition dl>div:first-child{padding-top:0}\n#work.work-edition dt{margin-bottom:5px;font:600 clamp(20px,1.9vw,26px)/1.5 var(--serif);color:var(--ink)}\n#work.work-edition dd{font:400 clamp(16px,1.18vw,18px)/1.8 system-ui,sans-serif;max-width:38em}\n@media(max-width:650px){\n #work.work-edition .room-heading{min-height:179px;padding:23px 18px;grid-template-columns:64% 1fr;gap:10px 0}\n #work.work-edition .room-heading .section-title{font-size:48px;gap:8px}\n #work.work-edition .room-heading .section-label{font-size:21px}\n #work.work-edition .room-heading .room-land{left:66%;background-position:51% center}\n #work.work-edition .work-intro{font-size:14px;line-height:1.65;padding-right:4px}\n #work.work-edition .learn-nav a{padding:14px 10px;font-size:18px;min-height:48px}\n #work.work-edition .learn-sheet:not([hidden]){display:block;margin:25px 0 30px}\n #work.work-edition .learn-sheet h2{display:flex;align-items:baseline;gap:10px;font-size:34px;margin-bottom:19px}\n #work.work-edition .learn-sheet h2 small{margin:0;font-size:14px}\n #work.work-edition dl>div{padding:14px 0}\n}\n#work{--work-photo:url(\"assets/life-system/work.webp\")}\n\n#work.studio {--cover-fg:#fff8e8;--cover-caption:#f4e9d6;--active-line:var(--metal);display:grid;grid-template-columns:minmax(220px,0.78fr) minmax(0,1.85fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:\"cover reading\" \"index reading\" \". reading\" \". back\";column-gap:clamp(30px,5.5vw,84px);align-items:start;max-width:1110px;margin-inline:auto;padding:clamp(24px,4vw,56px) 0 44px}\n#work.studio[hidden]{display:none}\n#work.studio .room-heading{grid-area:cover;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;position:relative;isolation:isolate;min-height:clamp(245px,23vw,320px);padding:24px;margin:0;overflow:hidden;border:0;border-radius:0;background:#253733}\n#work.studio .room-heading .room-land{position:absolute;z-index:-1;inset:0;mask:none;background:linear-gradient(0deg,rgba(9,23,23,.97),rgba(12,26,26,.70) 39%,rgba(12,26,26,.04) 78%),url(\"assets/life-system/work.webp\") 55% 46%/cover}\n#work.studio .section-title{order:1;color:var(--cover-fg);font:600 clamp(40px,4vw,61px)/1.1 var(--serif);letter-spacing:.02em;margin:0}\n#work.studio .work-intro{order:2;margin:12px 0 0;color:var(--cover-caption);font:400 15px/1.65 system-ui,sans-serif;max-width:19em}\n#work.studio .section-label{display:none}\n#work.studio .learn-nav{grid-area:index;display:grid;position:static;gap:0;margin:0;background:none;border:0}\n#work.studio .learn-nav a{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:12px 16px;border:0;border-bottom:1px solid var(--rule);font:500 19px/1.4 var(--serif);color:var(--quiet);background:transparent}\n#work.studio .learn-nav a[aria-current]{color:var(--ink);background:var(--surface);font-weight:650}\n#work.studio .learn-nav a[aria-current]::after{content:'→';color:var(--active-line);font:20px/1 system-ui}\n#work.studio .learn-sheet:not([hidden]){grid-area:reading;width:100%;padding:0;margin:0}\n#work.studio .learn-sheet h2{margin:0 0 6px;padding:0 0 18px;border:0;border-bottom:2px solid var(--ink);color:var(--ink);font:600 clamp(38px,4.5vw,66px)/1.12 var(--serif);letter-spacing:-.045em}\n#work.studio .learn-sheet small{display:inline-block;font:450 17px/1.6 system-ui,sans-serif;color:var(--quiet);letter-spacing:0;margin-left:13px}\n#work.studio dl>div{display:block;border-bottom:1px solid var(--rule);padding:clamp(16px,2.1vw,28px) 0}\n#work.studio dt{font:600 clamp(21px,2vw,27px)/1.4 var(--serif);color:var(--ink);margin-bottom:8px}\n#work.studio dd{max-width:34em;font:400 clamp(16px,1.35vw,19px)/1.85 system-ui,sans-serif;color:var(--soft)}\n#work.studio .room-return{grid-area:back;justify-self:start;margin-top:20px}\n.work-version-picker{display:block;font:500 14px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;max-width:10em;padding:7px 5px;min-height:40px}\n.nav-actions .work-version-picker{margin-right:4px}\n.work-version-picker:focus-visible,#work.studio .learn-nav a:focus-visible{outline:2px solid var(--metal);outline-offset:-2px}\nbody:not(:has(#work:not([hidden]))) .work-version-picker{display:none}\n@media(max-width:760px){\n#work.studio{display:block;padding-top:15px}\n#work.studio .room-heading{min-height:158px;padding:19px;justify-content:flex-end}\n#work.studio .room-heading .room-land{background:linear-gradient(90deg,rgba(9,23,23,.94) 0%,rgba(9,23,23,.87) 42%,rgba(9,23,23,.18) 80%),url(\"assets/life-system/work.webp\") 60% 55%/cover}\n#work.studio .section-title{font-size:38px}\n#work.studio .work-intro{font-size:14px;max-width:18em;margin-top:7px}\n#work.studio .learn-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}\n#work.studio .learn-nav a{justify-content:center;min-height:48px;font-size:18px;border:0}\n#work.studio .learn-nav a[aria-current]{background:none;box-shadow:inset 0 -3px var(--active-line)}\n#work.studio .learn-nav a[aria-current]::after{display:none}\n#work.studio .learn-sheet:not([hidden]){margin-top:27px}\n#work.studio .learn-sheet h2{font-size:36px;padding-bottom:13px;margin-bottom:0}\n#work.studio .learn-sheet small{font-size:15px;margin-left:8px}\n#work.studio .learn-sheet dl>div{padding:16px 0}\n#work.studio dd{font-size:16px;line-height:1.78}\n.nav-actions .work-version-picker{font-size:13px;min-height:36px;max-width:92px;margin:0}\n}\n#work.studio .work-intro{text-wrap:pretty}\n#work.studio .learn-sheet h2:focus-visible{outline:2px solid var(--active-line);outline-offset:4px;border-radius:0}\n";doc.head.append(style);
    const room=doc.getElementById('work');
  const banner=room.querySelector('.room-heading'), intro=room.querySelector('.work-intro');
  const title=banner.querySelector('h1'), english=banner.querySelector('.section-label');
  const picker=doc.createElement('select');
  picker.className='work-version-picker';
  picker.setAttribute('aria-label','工作页版本对照');
  for(const [id,label] of [['original','正式版'],['previous','上版设计'],['studio','新设计']]){
    const option=doc.createElement('option');option.value=id;option.textContent=label;picker.append(option);
  }
  const actions=doc.querySelector('.nav-actions');
  actions.prepend(picker);
  function choose(mode){
    room.classList.toggle('work-edition',mode==='previous');
    room.classList.toggle('studio',mode==='studio');
    banner.prepend(english);
    english.removeAttribute('aria-hidden');
    if(mode==='previous'){title.append(english);english.setAttribute('aria-hidden','true');}
    if(mode==='original')banner.after(intro);else banner.append(intro);
    picker.value=mode;
  }
  picker.addEventListener('change',()=>choose(picker.value));
  choose('studio');
  attached=doc;
}
frame.addEventListener('load',mountWhenReady);
setInterval(mountWhenReady,400);
</script></body></html>
