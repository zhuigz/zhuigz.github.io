<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>追光者 · 光 | The Light Chaser</title>
<meta name="description" content="一个属于追光者的小游戏 —— 你是一点光，在黑暗里收集散落的微光，点亮自己，直到光芒万丈。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@200;300;400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 暖金主色系（延续个人说明书） */
  --gold: #E8B87A;
  --gold-light: #F4D9A8;
  --gold-deep: #C99A56;
  --ember: #C36B5E;
  --accent-violet: #8E7AB8;

  --bg-deep: #07070C;
  --ink: #F2EFEB;
  --ink-soft: rgba(242,239,235,0.62);
  --ink-dim: rgba(242,239,235,0.34);
  --line: rgba(255,255,255,0.06);
  --line-strong: rgba(232,184,122,0.18);

  --serif-cn: 'Noto Serif SC', 'Source Han Serif SC', serif;
  --sans-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sans-en: 'Outfit', 'Noto Sans SC', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  --lum: 0; /* 当前光芒程度 0→1，驱动背景由暗转明 */
}

html, body { height: 100%; }
body {
  background: var(--bg-deep);
  color: var(--ink);
  font-family: var(--sans-cn);
  overflow: hidden;
  position: fixed; inset: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

/* ===================== 背景：由暗转明 ===================== */
/* 基础暗底，随光芒升起逐渐回暖 */
.stage {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(232,184,122,0.05), transparent 55%),
    radial-gradient(140% 120% at 50% 120%, rgba(195,107,94,0.05), transparent 60%),
    var(--bg-deep);
}
/* 暖光层：随 --lum 渐显，把整页“点亮” */
.warmth {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  mix-blend-mode: screen;
  background:
    radial-gradient(90% 70% at 50% 18%, rgba(244,217,168,0.55), transparent 60%),
    radial-gradient(120% 100% at 50% 100%, rgba(201,154,86,0.35), transparent 62%);
  opacity: 0;
  will-change: opacity;
}

/* 顶光束（god rays），随光芒升起越来越亮 */
.godrays { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; opacity: 0; will-change: opacity; }
.beam {
  position: absolute; top: -25%; left: 50%; height: 150%; width: 200px;
  background: linear-gradient(180deg, rgba(244,217,168,0.30), rgba(232,184,122,0.06) 55%, transparent);
  filter: blur(34px); transform-origin: top center;
  animation: beamSway 11s ease-in-out infinite alternate;
}
.beam.b1 { margin-left: -420px; --r: -17deg; transform: rotate(-17deg); }
.beam.b2 { margin-left: -120px; width: 280px; --r: -3deg; transform: rotate(-3deg); animation-delay: -3.5s; }
.beam.b3 { margin-left: 180px; --r: 11deg; transform: rotate(11deg); animation-delay: -6s; }
.beam.b4 { margin-left: 420px; --r: 20deg; transform: rotate(20deg); animation-delay: -8.5s; }
@keyframes beamSway {
  from { opacity: 0.55; transform: rotate(var(--r)) translateX(-16px); }
  to   { opacity: 1;    transform: rotate(var(--r)) translateX(16px); }
}

/* 颗粒噪点，统一质感 */
.grain {
  position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.5;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

/* 游戏画布 */
#game { position: fixed; inset: 0; z-index: 3; display: block; }
#game.playing { cursor: none; }

/* ===================== HUD ===================== */
.hud {
  position: fixed; inset: 0; z-index: 5; pointer-events: none;
  padding: 18px 22px;
  display: flex; justify-content: space-between; align-items: flex-start;
  opacity: 0; transition: opacity 0.6s ease;
  font-family: var(--mono);
}
.hud.on { opacity: 1; }

/* 左上：光芒进度 */
.lum-box { width: min(300px, 46vw); }
.lum-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; letter-spacing: 3px; color: var(--gold);
  text-transform: uppercase; margin-bottom: 9px;
}
.lum-label .zh { font-family: var(--serif-cn); letter-spacing: 2px; color: var(--ink); font-weight: 700; }
.lum-label .pct { margin-left: auto; color: var(--ink-soft); }
.lum-track {
  height: 6px; border-radius: 999px; overflow: hidden;
  background: rgba(255,255,255,0.07); border: 1px solid var(--line);
}
.lum-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-light));
  box-shadow: 0 0 16px rgba(232,184,122,0.7);
  transition: width 0.18s ease;
}

/* 右上：数据 */
.stat-box { text-align: right; display: flex; flex-direction: column; gap: 7px; }
.stat-line { font-size: 12px; letter-spacing: 1.5px; color: var(--ink-soft); }
.stat-line b {
  font-family: var(--sans-en); font-weight: 800; font-size: 15px;
  color: var(--gold-light); margin-left: 8px; letter-spacing: 0;
}
.combo {
  font-family: var(--sans-en); font-weight: 900; letter-spacing: 1px;
  font-size: 13px; color: var(--gold); opacity: 0; transform: translateY(-4px);
  transition: opacity 0.25s, transform 0.25s;
}
.combo.show { opacity: 1; transform: translateY(0); }

/* 角标 logo */
.brand {
  position: fixed; left: 22px; bottom: 18px; z-index: 5; pointer-events: none;
  font-family: var(--serif-cn); font-weight: 700; font-size: 14px; color: var(--gold);
  letter-spacing: 2px; display: inline-flex; align-items: center; gap: 8px;
  opacity: 0.5;
}
.brand::before { content: '✦'; font-family: var(--sans-en); animation: spin 16s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 静音按钮 */
.sound-btn {
  position: fixed; right: 22px; bottom: 16px; z-index: 6;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(7,7,12,0.55); backdrop-filter: blur(10px);
  border: 1px solid var(--line); color: var(--ink-soft);
  font-size: 16px; cursor: pointer; display: none;
  align-items: center; justify-content: center; transition: all 0.3s;
}
.sound-btn.on { display: flex; }
.sound-btn:hover { color: var(--gold); border-color: var(--line-strong); }

/* ===================== 里程碑信条 toast ===================== */
.creed-layer {
  position: fixed; left: 0; right: 0; top: 26%; z-index: 6;
  display: flex; justify-content: center; pointer-events: none; padding: 0 24px;
}
.creed {
  font-family: var(--serif-cn); font-weight: 700;
  font-size: clamp(20px, 4.4vw, 34px); letter-spacing: 2px; text-align: center;
  background: linear-gradient(120deg, #fff, var(--gold-light) 40%, var(--gold) 70%, var(--gold-deep));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 6px 30px rgba(232,184,122,0.25));
  opacity: 0; transform: translateY(18px) scale(0.96);
}
.creed.play { animation: creedIn 2.6s cubic-bezier(0.16,1,0.3,1) forwards; }
@keyframes creedIn {
  0% { opacity: 0; transform: translateY(18px) scale(0.96); filter: blur(8px) drop-shadow(0 6px 30px rgba(232,184,122,0.25)); }
  18% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) drop-shadow(0 6px 30px rgba(232,184,122,0.3)); }
  78% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-16px) scale(1.02); }
}

/* ===================== 通用遮罩面板 ===================== */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 26px;
  background: radial-gradient(120% 90% at 50% 35%, rgba(7,7,12,0.55), rgba(7,7,12,0.86));
  backdrop-filter: blur(3px);
  transition: opacity 0.7s ease, visibility 0.7s;
}
.overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

/* —— 起始：一点光，破暗而生 —— */
.spark {
  width: 12px; height: 12px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 26px var(--gold), 0 0 80px rgba(232,184,122,0.55);
  animation: sparkPulse 2.2s ease-in-out infinite; margin-bottom: 40px; position: relative;
}
.spark::after {
  content: ''; position: absolute; inset: -22px; border-radius: 50%;
  border: 1px solid rgba(232,184,122,0.35); animation: sparkRing 2.2s ease-out infinite;
}
@keyframes sparkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.45); } }
@keyframes sparkRing { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }

.eyebrow {
  font-family: var(--sans-en); font-size: 11px; letter-spacing: 6px;
  text-transform: uppercase; color: var(--ink-dim); margin-bottom: 18px;
}
.title {
  font-family: var(--serif-cn); font-weight: 900; line-height: 1;
  font-size: clamp(52px, 12vw, 120px); letter-spacing: clamp(4px, 1.2vw, 12px);
  background: linear-gradient(120deg, #fff 0%, var(--gold-light) 30%, var(--gold) 52%, var(--gold-deep) 66%, var(--gold-light) 88%, #fff 100%);
  background-size: 240% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: titleShine 8s ease-in-out infinite;
}
@keyframes titleShine { 0%,100% { background-position: 0% center; } 50% { background-position: 220% center; } }
.subtitle {
  font-family: var(--sans-en); font-size: clamp(13px, 2vw, 16px); letter-spacing: 5px;
  color: var(--ink-soft); margin-top: 20px;
}
.howto {
  font-family: var(--serif-cn); font-size: clamp(14px, 2vw, 16px); line-height: 2;
  color: var(--ink-soft); margin-top: 30px; max-width: 460px; letter-spacing: 1px;
}
.howto em { font-style: normal; color: var(--gold); font-weight: 600; }

.btn {
  margin-top: 40px; pointer-events: auto; cursor: pointer;
  font-family: var(--sans-cn); font-size: 15px; letter-spacing: 4px; color: var(--bg-deep);
  font-weight: 700;
  padding: 15px 44px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
  box-shadow: 0 14px 40px rgba(232,184,122,0.28), 0 0 0 1px rgba(244,217,168,0.4) inset;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 50px rgba(232,184,122,0.4), 0 0 0 1px rgba(244,217,168,0.6) inset; }
.btn:active { transform: translateY(0); }
.btn.ghost {
  background: transparent; color: var(--gold); font-weight: 500;
  border: 1px solid rgba(232,184,122,0.35);
  box-shadow: none; padding: 13px 34px; margin-top: 18px; font-size: 13px; letter-spacing: 3px;
}
.btn.ghost:hover { background: rgba(232,184,122,0.1); box-shadow: 0 0 24px rgba(232,184,122,0.18); transform: translateY(-1px); }

.hint-row {
  margin-top: 26px; font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
  color: var(--ink-dim); display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
}
.hint-row span { display: inline-flex; align-items: center; gap: 7px; }
.kbd {
  font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px;
  background: rgba(255,255,255,0.03);
}

/* —— 结算：光芒万丈 —— */
.win-title {
  font-family: var(--serif-cn); font-weight: 900; line-height: 1.05;
  font-size: clamp(48px, 11vw, 110px); letter-spacing: clamp(4px, 1.4vw, 14px);
  background: linear-gradient(120deg, #fff, var(--gold-light) 35%, var(--gold) 60%, var(--gold-deep));
  background-size: 220% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: titleShine 7s ease-in-out infinite;
}
.win-quote {
  font-family: var(--serif-cn); font-size: clamp(17px, 2.6vw, 24px); color: var(--gold);
  margin-top: 24px; letter-spacing: 2px; font-weight: 700;
}
.win-stats {
  margin-top: 40px; display: flex; gap: 0; flex-wrap: wrap; justify-content: center;
  border: 1px solid var(--line-strong); border-radius: 18px; overflow: hidden;
  background: rgba(255,255,255,0.02);
}
.win-stat { padding: 22px 30px; border-right: 1px solid var(--line); min-width: 120px; }
.win-stat:last-child { border-right: none; }
.win-stat .v {
  font-family: var(--sans-en); font-weight: 800; font-size: clamp(28px, 5vw, 40px);
  background: linear-gradient(160deg, #fff, var(--gold) 70%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.win-stat .k {
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--ink-dim);
  text-transform: uppercase; margin-top: 8px;
}
.win-line {
  margin-top: 34px; font-family: var(--serif-cn); font-size: clamp(14px, 2vw, 16px);
  color: var(--ink-soft); line-height: 2; max-width: 520px; letter-spacing: 1px;
}
.win-line em { font-style: normal; color: var(--gold); font-weight: 600; }

@media (max-width: 560px) {
  .hud { padding: 14px 16px; }
  .lum-box { width: 54vw; }
  .win-stat { padding: 18px 20px; min-width: 96px; }
}

/* 尊重减少动效偏好 */
@media (prefers-reduced-motion: reduce) {
  .beam, .spark, .spark::after, .brand::before, .title, .win-title { animation: none !important; }
  .warmth, .godrays { transition: none; }
  .creed.play { animation-duration: 0.01ms; opacity: 1; }
}
</style>
</head>
<body>

<!-- 背景层 -->
<div class="stage" aria-hidden="true"></div>
<div class="warmth" id="warmth" aria-hidden="true"></div>
<div class="godrays" id="godrays" aria-hidden="true">
  <div class="beam b1"></div>
  <div class="beam b2"></div>
  <div class="beam b3"></div>
  <div class="beam b4"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<!-- 游戏画布 -->
<canvas id="game" aria-label="追光者游戏画面"></canvas>

<!-- HUD -->
<div class="hud" id="hud" aria-hidden="true">
  <div class="lum-box">
    <div class="lum-label">
      <span>Luminosity</span><span class="zh">光芒</span><span class="pct" id="pct">0%</span>
    </div>
    <div class="lum-track"><div class="lum-fill" id="lumFill"></div></div>
  </div>
  <div class="stat-box">
    <div class="stat-line">光点 <b id="motes">0</b></div>
    <div class="stat-line">用时 <b id="time">0.0s</b></div>
    <div class="combo" id="combo">连击 ×1</div>
  </div>
</div>

<div class="brand">追光者</div>
<button class="sound-btn" id="soundBtn" type="button" aria-label="开关声音">♪</button>

<!-- 里程碑信条 -->
<div class="creed-layer" aria-hidden="true"><div class="creed" id="creed"></div></div>

<!-- 起始面板 -->
<div class="overlay" id="startScreen">
  <div class="spark" aria-hidden="true"></div>
  <div class="eyebrow">The Light Chaser · 一点光，破暗而生</div>
  <h1 class="title">追光</h1>
  <div class="subtitle">CHASE THE LIGHT</div>
  <p class="howto">你是黑暗里的<em>一点光</em>。<br>移动你的光，去拾起散落的<em>微光</em>，<br>避开<em>暗影</em>（思维钢印），<br>把自己一点点点亮 —— 直到<em>光芒万丈</em>。</p>
  <button class="btn" id="startBtn" type="button">开始追光</button>
  <div class="hint-row">
    <span><span class="kbd">移动鼠标 / 手指</span> 控制光</span>
    <span><span class="kbd">W A S D</span> / <span class="kbd">↑←↓→</span> 也可</span>
  </div>
</div>

<!-- 结算面板 -->
<div class="overlay hide" id="winScreen">
  <div class="eyebrow">光芒万丈 · LUMINOUS</div>
  <h1 class="win-title">光芒万丈</h1>
  <div class="win-quote">追光的人，终将光芒万丈 ✨</div>
  <div class="win-stats">
    <div class="win-stat"><div class="v" id="wMotes">0</div><div class="k">collected · 光点</div></div>
    <div class="win-stat"><div class="v" id="wTime">0s</div><div class="k">time · 用时</div></div>
    <div class="win-stat"><div class="v" id="wCombo">×1</div><div class="k">best combo · 连击</div></div>
  </div>
  <p class="win-line" id="winLine"></p>
  <button class="btn" id="replayBtn" type="button">再追一次光</button>
  <button class="btn ghost" id="shareHint" type="button">道阻且长，行则将至</button>
</div>

<script>
(function () {
  'use strict';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // —— DOM 引用 ——
  const hud = document.getElementById('hud');
  const lumFill = document.getElementById('lumFill');
  const pctEl = document.getElementById('pct');
  const motesEl = document.getElementById('motes');
  const timeEl = document.getElementById('time');
  const comboEl = document.getElementById('combo');
  const creedEl = document.getElementById('creed');
  const warmth = document.getElementById('warmth');
  const godrays = document.getElementById('godrays');
  const startScreen = document.getElementById('startScreen');
  const winScreen = document.getElementById('winScreen');
  const startBtn = document.getElementById('startBtn');
  const replayBtn = document.getElementById('replayBtn');
  const soundBtn = document.getElementById('soundBtn');

  // —— 视口尺寸 ——
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // —— 工具 ——
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

  // 光点配色：70% 金 · 20% 余烬 · 10% 浅金（与说明书签名画面一致）
  const MOTE_COLORS = ['232,184,122', '232,184,122', '232,184,122', '232,184,122',
    '232,184,122', '232,184,122', '232,184,122', '195,107,94', '195,107,94', '244,217,168'];

  // —— 里程碑信条（全部来自个人说明书 / 生命底色） ——
  const CREEDS = [
    { at: 0.16, text: '一点光，破暗而生。' },
    { at: 0.30, text: '世界不死，理想不灭。' },
    { at: 0.44, text: '凡事发生，必有利于我。' },
    { at: 0.58, text: '主动，真的会有故事。' },
    { at: 0.72, text: '道阻且长，行则将至。' },
    { at: 0.87, text: '于道各努力，千里自同风。' }
  ];
  let creedIdx = 0;

  // —— 结算寄语池 ——
  const WIN_LINES = [
    '你收集了 {m} 点光，用 {t} 把黑夜走成了白昼。<br>这一次，<em>你就是那束光</em>。',
    '从一点微光到光芒万丈 —— <br>你用 {t}、{m} 点光证明：<em>追光的人，终会光芒万丈</em>。',
    '黑暗没有消失，是你变得足够亮。<br>{m} 点光，{t}。<em>行而不辍，未来可期</em>。'
  ];

  // —— 游戏状态 ——
  let state = 'menu'; // menu | playing | win
  let player, motes, shadows, bursts, dust;
  let lum, score, combo, bestCombo, comboTimer, startTime, elapsed, invuln, flash, lastTs;
  const target = { x: 0, y: 0 };
  const keys = {};

  function makePlayer() {
    return { x: W / 2, y: H / 2, vx: 0, vy: 0, trail: [] };
  }

  function spawnMote() {
    // 在玩家视野内、但不要正好压在玩家身上
    let x, y, tries = 0;
    do {
      x = rand(40, W - 40); y = rand(60, H - 60); tries++;
    } while (player && dist2(x, y, player.x, player.y) < 140 * 140 && tries < 8);
    return {
      x, y, r: rand(2.2, 4.2),
      vx: rand(-0.25, 0.25), vy: rand(-0.5, -0.12),
      phase: rand(0, Math.PI * 2), freq: rand(0.001, 0.0026),
      color: MOTE_COLORS[(Math.random() * MOTE_COLORS.length) | 0],
      caught: false
    };
  }

  function spawnShadow() {
    const edge = (Math.random() * 4) | 0;
    let x, y;
    if (edge === 0) { x = -30; y = rand(0, H); }
    else if (edge === 1) { x = W + 30; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = -30; }
    else { x = rand(0, W); y = H + 30; }
    const tx = rand(W * 0.25, W * 0.75), ty = rand(H * 0.25, H * 0.75);
    const a = Math.atan2(ty - y, tx - x);
    const sp = rand(0.35, 0.75);
    return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(15, 26), phase: rand(0, 6.28), life: 0 };
  }

  function makeDust(n) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      arr.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.3),
        vy: -rand(0.04, 0.18), a: rand(0.06, 0.22), phase: rand(0, 6.28), freq: rand(0.001, 0.003) });
    }
    return arr;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(0.6, 3.4);
      bursts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: rand(1, 2.6), life: 1, decay: rand(0.012, 0.03), color });
    }
  }

  function reset() {
    player = makePlayer();
    target.x = player.x; target.y = player.y;
    motes = []; shadows = []; bursts = [];
    dust = makeDust(reduceMotion ? 26 : 60);
    const moteCount = reduceMotion ? 12 : 16;
    for (let i = 0; i < moteCount; i++) motes.push(spawnMote());
    lum = 0.05; score = 0; combo = 0; bestCombo = 0; comboTimer = 0;
    elapsed = 0; invuln = 0; flash = 0; creedIdx = 0;
    setLum(lum);
    updateHud();
  }

  // —— 背景亮度联动 ——
  function setLum(v) {
    const e = Math.pow(v, 0.85);
    warmth.style.opacity = (e * 0.9).toFixed(3);
    godrays.style.opacity = (e * 0.95).toFixed(3);
    document.documentElement.style.setProperty('--lum', e.toFixed(3));
  }

  function updateHud() {
    const p = clamp(lum, 0, 1);
    lumFill.style.width = (p * 100).toFixed(1) + '%';
    pctEl.textContent = Math.round(p * 100) + '%';
    motesEl.textContent = score;
    timeEl.textContent = elapsed.toFixed(1) + 's';
  }

  function showCreed(text) {
    creedEl.textContent = text;
    creedEl.classList.remove('play');
    void creedEl.offsetWidth; // 重启动画
    creedEl.classList.add('play');
  }

  // —— 连击 ——
  function comboMultiplier() { return 1 + Math.min(combo, 25) * 0.06; }
  function showCombo() {
    if (combo >= 2) {
      comboEl.textContent = '连击 ×' + combo;
      comboEl.classList.add('show');
    }
  }
  function dropCombo() { combo = 0; comboEl.classList.remove('show'); }

  // ===================== 主循环 =====================
  function tick(ts) {
    if (state !== 'playing') return;
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 16.6667; // 归一到 ~60fps 的步长
    lastTs = ts;
    dt = Math.min(dt, 2.5);

    elapsed = (performance.now() - startTime) / 1000;

    // —— 键盘把目标点推开 ——
    const kSpeed = 9 * dt;
    if (keys.left) target.x -= kSpeed;
    if (keys.right) target.x += kSpeed;
    if (keys.up) target.y -= kSpeed;
    if (keys.down) target.y += kSpeed;
    target.x = clamp(target.x, 0, W); target.y = clamp(target.y, 0, H);

    // —— 玩家缓动跟随 ——
    const px = player.x, py = player.y;
    player.x += (target.x - player.x) * Math.min(1, 0.2 * dt);
    player.y += (target.y - player.y) * Math.min(1, 0.2 * dt);
    player.vx = player.x - px; player.vy = player.y - py;
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 16) player.trail.shift();

    const glow = 16 + lum * 30;          // 光晕半径随亮度增长
    const collectR = 30 + lum * 46;      // 拾取半径
    const attractR = 150 + lum * 60;     // 吸附半径

    // —— 光点 ——
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const d2 = dist2(m.x, m.y, player.x, player.y);
      if (d2 < attractR * attractR) {
        const d = Math.sqrt(d2) + 0.01;
        const pull = (1 - d / attractR) * 0.9 * dt;
        m.vx += ((player.x - m.x) / d) * pull;
        m.vy += ((player.y - m.y) / d) * pull;
      }
      if (d2 < collectR * collectR) {
        // 收集！
        score++;
        combo++; bestCombo = Math.max(bestCombo, combo);
        comboTimer = 110;
        lum = clamp(lum + 0.0092 * comboMultiplier(), 0, 1);
        burst(m.x, m.y, m.color, 9 + (combo > 6 ? 5 : 0));
        flash = Math.min(flash + 0.22, 0.7);
        showCombo();
        ping(combo);
        setLum(lum);
        motes[i] = spawnMote();
        // 里程碑信条
        if (creedIdx < CREEDS.length && lum >= CREEDS[creedIdx].at) {
          showCreed(CREEDS[creedIdx].text);
          creedIdx++;
        }
        if (lum >= 1) { win(); return; }
        continue;
      }
      m.vx *= 0.97; m.vy *= 0.97;
      m.vy -= 0.004 * dt; // 轻轻上浮
      m.x += m.vx * dt; m.y += m.vy * dt;
      // 边界回收
      if (m.y < -20 || m.x < -30 || m.x > W + 30 || m.y > H + 40) motes[i] = spawnMote();
    }

    // —— 连击衰减（约 1.8s 不收集即断连） ——
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) dropCombo(); }

    // —— 暗影（思维钢印）：亮度越高，出现越多 ——
    const maxShadows = Math.floor(lum * (reduceMotion ? 4 : 7));
    if (shadows.length < maxShadows && Math.random() < 0.012 * dt) shadows.push(spawnShadow());
    if (invuln > 0) invuln -= dt;
    for (let i = shadows.length - 1; i >= 0; i--) {
      const s = shadows[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt;
      s.phase += 0.04 * dt;
      if (s.x < -60 || s.x > W + 60 || s.y < -60 || s.y > H + 60) { shadows.splice(i, 1); continue; }
      const hitR = s.r + glow * 0.5;
      if (invuln <= 0 && dist2(s.x, s.y, player.x, player.y) < hitR * hitR) {
        // 被暗影碰到：变暗、断连击
        lum = clamp(lum - 0.03, 0.02, 1);
        dropCombo();
        invuln = 48; // ~0.8s 无敌
        flash = -0.6; // 负向闪（变暗）
        thud();
        setLum(lum);
        shadows.splice(i, 1);
      }
    }

    // —— 爆光碎屑 ——
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 0.94; b.vy *= 0.94;
      b.life -= b.decay * dt;
      if (b.life <= 0) bursts.splice(i, 1);
    }

    // —— 漂浮微尘 ——
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      p.y += p.vy * dt;
      if (p.y < -5) { p.y = H + 5; p.x = rand(0, W); }
    }

    flash *= Math.pow(0.9, dt);
    updateHud();
    render(ts, glow, collectR);
    requestAnimationFrame(tick);
  }

  // ===================== 渲染 =====================
  function render(ts, glow, collectR) {
    ctx.clearRect(0, 0, W, H);

    // 屏幕闪光（收集=暖，受击=暗）
    if (flash > 0.02) {
      ctx.fillStyle = 'rgba(244,217,168,' + (flash * 0.12).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    } else if (flash < -0.02) {
      ctx.fillStyle = 'rgba(20,16,30,' + (Math.min(-flash, 0.6) * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = 'lighter';

    // 微尘
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      const a = (p.a * (0.6 + 0.4 * Math.sin(ts * p.freq + p.phase))).toFixed(3);
      ctx.fillStyle = 'rgba(232,184,122,' + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }

    // 光点
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const tw = 0.55 + 0.45 * Math.sin(ts * m.freq + m.phase);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
      g.addColorStop(0, 'rgba(' + m.color + ',' + (0.9 * tw).toFixed(3) + ')');
      g.addColorStop(0.4, 'rgba(' + m.color + ',' + (0.35 * tw).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + m.color + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 5, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,250,240,' + (0.85 * tw).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.6, 0, 6.2832); ctx.fill();
    }

    // 爆光碎屑
    for (let i = 0; i < bursts.length; i++) {
      const b = bursts[i];
      ctx.fillStyle = 'rgba(' + b.color + ',' + (b.life * 0.9).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
    }

    // 玩家拖尾
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const k = i / player.trail.length;
      ctx.fillStyle = 'rgba(232,184,122,' + (k * 0.16).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(t.x, t.y, glow * 0.5 * k, 0, 6.2832); ctx.fill();
    }

    // 暗影（思维钢印）—— 用普通混合画暗块 + 紫色冷边
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < shadows.length; i++) {
      const s = shadows[i];
      const wob = s.r + Math.sin(s.phase) * 1.6;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, wob * 1.6);
      g.addColorStop(0, 'rgba(8,7,14,0.92)');
      g.addColorStop(0.6, 'rgba(20,16,32,0.7)');
      g.addColorStop(1, 'rgba(20,16,32,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, wob * 1.6, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(142,122,184,0.45)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, wob, 0, 6.2832); ctx.stroke();
    }

    // 玩家本体光球
    ctx.globalCompositeOperation = 'lighter';
    const blink = invuln > 0 ? (0.45 + 0.55 * Math.abs(Math.sin(ts * 0.02))) : 1;
    const pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, glow * 2.4);
    pg.addColorStop(0, 'rgba(255,252,245,' + (0.95 * blink).toFixed(3) + ')');
    pg.addColorStop(0.25, 'rgba(244,217,168,' + (0.8 * blink).toFixed(3) + ')');
    pg.addColorStop(0.6, 'rgba(232,184,122,' + (0.32 * blink).toFixed(3) + ')');
    pg.addColorStop(1, 'rgba(232,184,122,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(player.x, player.y, glow * 2.4, 0, 6.2832); ctx.fill();
    // 拾取范围微光环
    ctx.strokeStyle = 'rgba(244,217,168,' + (0.10 * blink).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(player.x, player.y, collectR, 0, 6.2832); ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
  }

  // ===================== 声音（WebAudio 合成，无外部文件） =====================
  let actx = null, muted = false;
  // C 大调五声音阶，连击越高音越亮
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66];
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function ping(c) {
    if (muted) return; const a = audio(); if (!a) return;
    const f = SCALE[Math.min(c - 1, SCALE.length - 1)] || SCALE[0];
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.13, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.28);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.3);
  }
  function thud() {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(180, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.25);
    g.gain.setValueAtTime(0.18, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.3);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.32);
  }
  function fanfare() {
    if (muted) return; const a = audio(); if (!a) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      const t0 = a.currentTime + i * 0.12;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g).connect(a.destination);
      o.start(t0); o.stop(t0 + 0.62);
    });
  }

  // ===================== 流程控制 =====================
  function startGame() {
    reset();
    state = 'playing';
    lastTs = 0;
    startTime = performance.now();
    startScreen.classList.add('hide');
    winScreen.classList.add('hide');
    hud.classList.add('on');
    canvas.classList.add('playing');
    soundBtn.classList.add('on');
    audio(); // 用户手势内激活音频
    requestAnimationFrame(tick);
  }

  function win() {
    state = 'win';
    lum = 1; setLum(1); updateHud();
    fanfare();
    canvas.classList.remove('playing');
    hud.classList.remove('on');
    // 终极爆光
    for (let i = 0; i < 60; i++) burst(player.x, player.y, MOTE_COLORS[(Math.random() * 10) | 0], 1);
    document.getElementById('wMotes').textContent = score;
    document.getElementById('wTime').textContent = elapsed.toFixed(1) + 's';
    document.getElementById('wCombo').textContent = '×' + bestCombo;
    const tmpl = WIN_LINES[(Math.random() * WIN_LINES.length) | 0];
    document.getElementById('winLine').innerHTML =
      tmpl.replace(/\{m\}/g, score).replace(/\{t\}/g, elapsed.toFixed(1) + 's');
    setTimeout(() => winScreen.classList.remove('hide'), 700);
  }

  // —— 输入 ——
  function setTargetFromEvent(e) {
    const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
    target.x = t.clientX; target.y = t.clientY;
  }
  window.addEventListener('pointermove', (e) => { if (state === 'playing') setTargetFromEvent(e); }, { passive: true });
  window.addEventListener('touchmove', (e) => { if (state === 'playing') { setTargetFromEvent(e); e.preventDefault(); } }, { passive: false });
  window.addEventListener('touchstart', (e) => { if (state === 'playing') setTargetFromEvent(e); }, { passive: true });

  const KEYMAP = {
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    ArrowUp: 'up', w: 'up', W: 'up',
    ArrowDown: 'down', s: 'down', S: 'down'
  };
  window.addEventListener('keydown', (e) => {
    if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; if (state === 'playing') e.preventDefault(); }
    if (e.key === 'Enter' && state !== 'playing') startGame();
  });
  window.addEventListener('keyup', (e) => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });

  // —— 按钮 ——
  startBtn.addEventListener('click', startGame);
  replayBtn.addEventListener('click', startGame);
  document.getElementById('shareHint').addEventListener('click', startGame);
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    soundBtn.textContent = muted ? '♪̶' : '♪';
    soundBtn.style.color = muted ? 'var(--ink-dim)' : '';
    if (!muted) audio();
  });

  // —— 切后台暂停 ——
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state === 'playing') {
      lastTs = 0; requestAnimationFrame(tick);
    }
  });

  // 初始把目标点放在中心，避免首帧乱跳
  target.x = W / 2; target.y = H / 2;
})();
</script>
</body>
</html>
